services:
  mock-api:
    build:
      context: .
      dockerfile: apps/mock-api/Dockerfile
    container_name: oio-mock-api
    restart: unless-stopped
    env_file:
      - ./apps/mock-api/.env
    environment:
      PORT: 3001
      MOCK_API_DATA_FILE: /app/apps/mock-api/generated-audio/records.json
    expose:
      - "3001"
    volumes:
      - mock_api_data:/app/apps/mock-api/generated-audio
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: oio-web
    restart: unless-stopped
    depends_on:
      - mock-api
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  mock_api_data:
    name: mock_api_data
